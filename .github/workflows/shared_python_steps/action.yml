name: "Shared Check Steps for Python"
inputs:
  python-version:
    description: "Python version used for example compilation checks"
    required: true
runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install the latest flexivsimplugin 2.1.x
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "flexivsimplugin==2.1.*"

    - name: Byte-compile Python examples
      shell: bash
      run: |
        python - <<'PY'
        from pathlib import Path
        import py_compile

        for path in sorted(Path('example_py').glob('*.py')):
            py_compile.compile(str(path), doraise=True)
            print(f'py_compile OK: {path}')
        PY

    # Import the installed package and construct a node. Nothing serves this serial number, so the
    # node must come up and report that it is not connected.
    - name: Smoke test the installed package
      shell: bash
      run: |
        python - <<'PY'
        import time
        import flexivsimplugin
        node = flexivsimplugin.UserNode("Rizon4-CI0000")
        time.sleep(1.5)
        assert node.connected() is False
        print("flexivsimplugin", flexivsimplugin.__version__, "OK")
        PY
